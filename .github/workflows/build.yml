name: Build Windows app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        shell: cmd
        run: build.bat
      - name: Smoke test (start UI, then exit)
        shell: pwsh
        run: |
          $p = Start-Process dist\GoogleHomeWidget.exe -ArgumentList "--check" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Timed out" }
          if ($p.ExitCode -ne 0) { throw "Exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: GoogleHomeWidget
          path: dist/GoogleHomeWidget.exe
