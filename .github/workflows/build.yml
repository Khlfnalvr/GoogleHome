name: Build Windows app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build exe and installer
        shell: cmd
        run: build.bat
      - name: Smoke test (start UI, then exit)
        shell: pwsh
        run: |
          $p = Start-Process dist\GoogleHomeWidget.exe -ArgumentList "--check" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Timed out" }
          if ($p.ExitCode -ne 0) { throw "Exit code $($p.ExitCode)" }
      - name: Test installer (silent install, then uninstall)
        shell: pwsh
        run: |
          Start-Process dist\GoogleHomeWidget-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/TASKS=startup" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Google Home Widget"
          if (-not (Test-Path "$app\GoogleHomeWidget.exe")) { throw "App not installed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Google Home Widget.lnk")) { throw "No Start Menu shortcut" }
          Get-ItemPropertyValue HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name GoogleHomeWidget
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          # The uninstaller hands off to a temp copy, so wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\GoogleHomeWidget.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\GoogleHomeWidget.exe") { throw "Uninstall failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: GoogleHomeWidget-Setup
          path: dist/GoogleHomeWidget-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: GoogleHomeWidget-portable
          path: dist/GoogleHomeWidget.exe
